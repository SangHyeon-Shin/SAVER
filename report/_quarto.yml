project:
  type: book
  output-dir: _build

book:
  title: "강성 매핑 기반 압박점 자동 탐색과 음압 지면 고정을 적용한 심폐소생 보조장치(SAVER)의 설계 및 검증"
  author: "신상현, 서정준, 한건민, 한성윤 (지도교수 양다솜)"
  date: "2026-09-16"
  chapters:
    - index.qmd
    - 01_intro.qmd
    - 02_design.qmd
    - 03_verification.qmd
    - 04_conclusion.qmd
  appendices:
    - 90_appendix.qmd

bibliography: refs.bib
lang: ko

format:
  docx:
    # KSME 공식 양식은 templates/ksme-reference.docx 로 두면 render.sh 가 자동 적용한다.
    # 파일이 없을 때 렌더링이 실패하지 않도록 여기에 하드코딩하지 않는다.
    number-sections: true
    toc: false
    fig-align: center
  html:
    theme: cosmo
    number-sections: true

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: "그림"
  tbl-prefix: "표"
  eq-prefix: "식"
  labels: arabic
  subref-labels: alpha a
